<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">\
    <link rel="stylesheet" href="RegisterRrShoe.css"> 
    <title>Document</title>
</head>


<body>
    <div class="Register-Container">
        <h1>RRshoe Store</h1>
        <p>Register Your Account</p>


       <form id="registerForm">

        <label for="Registerusername">Input your username</label>
        <input type="text" id="Registerusername" placeholder="Username" required>

        <label for="Registeremail">Input your Email</label>
        <input type="email" id="Registeremail" placeholder="Email" required>

        <label for="confirmEmail">Confirm Your Email</label>
        <input type="email" id="confirmEmail" placeholder="Confirm Email" required>
        <p id="message"></p>

        <label for="Registerpassword">Password</label>
        <input type="password" id="Registerpassword" placeholder="Password" required>

        <label for="confirmPassword">Confirm your Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <p id="message"></p>

        <button type="submit">REGISTER</button>


        
       </form>

       <p>Sudah punya akun?<a href="LgPgRRshoe.html"> Login disini</a></p>
    </div>
    <script src="RegisterRrShoe.js"></script>
</body>
</html>
