<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="MainPgRrShoe.css">
    <title>Document</title>
</head>
<body>
    <header>
    <h1>RRshoe Store</h1>
    <div class="search">
        <input type="text" id="searchInput" placeholder="Search Product">
        <button id="searchButton">Search</button>
    </div>
</header>

<main>

    <h2>Pilihan Produk</h2>

    <div class="product-container">
        <div class="product-card product-card1">
             <img src="Shoes_Product.jpg/Nike_Alphafy.jpg" alt="Sepatu">
             <h3>Nike Alphafy</h3>
             <p>Rp1.899.000</p>
             <button id="buttonCard1">Beli</button>
        </div>

        <div class="product-card product-card2">
            <img src="Shoes_Product.jpg/Nike_Maxfly.jpg" alt="Sepatu">
            <h3>Nike Maxfly</h3>
            <p>Rp1.566.000</p>
            <button id="buttonCard2">Beli</button>
        </div>

        <div class="product-card product-card3">
            <img src="Shoes_Product.jpg/Nike-Zoom_Superfly_Elite2.jpg" alt="Sepatu">
            <h3>Nike Zoom Superfly Elite 2</h3>
            <p>Rp2.599.000</p>
            <button id="buttonCard3">Beli</button>
        </div>
        
        <div class="product-card product-card4">
            <img src="Shoes_Product.jpg/Nike_Rival_Sprint.jpg" alt="Sepatu">
            <h3>Nike Rival Sprint</h3>
            <p>Rp2.399.000</p>
            <button id="buttonCard4">Beli</button>
        </div>

        <div class="product-card product-card5">
            <img src="Shoes_Product.jpg/Nike_Vomero_Plus.jpg" alt="Sepatu">
            <h3>Nike Vomero Plus</h3>
            <p>Rp1.999.000</p>
            <button id="buttonCard5">Beli</button>
        </div>
        
        
    </div>

</main>
<script src="MainPgRrShoe.js"></script>

</html>
